# config_test.toml — Local integration test configuration
# Points all paths to ./test_data/ for safe local testing.

[paths]
watch_dir = "./test_drop"
state_file = "./test_data/cam_state.bin"
metadata_db = "./test_data/metadata.db"

[encoder]
model_name = "dinov2_vitl14"
device = "cpu"

[cam]
key_dim = 1024
value_dim = 1024
max_entries = 1000
vigilance = 0.85
hebb_lr = 0.1
key_lr = 0.05
inference_k = 25
inference_temp = 0.05
use_lfu = true
use_bfloat16 = false
immutable_keys = false

[eviction]
min_per_class = 5

[ingest]
batch_size = 4
batch_window_sec = 2.0
checkpoint_interval = 100
file_extensions = ["*.ARW", "*.arw", "*.JPG", "*.jpg", "*.jpeg"]
